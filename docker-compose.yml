# Prep Pilot — full stack in demo mode (no API keys required)
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      MODEL_PROVIDER: demo
      DATA_DIR: /app/data
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      MAX_UPLOAD_BYTES: "8388608"
    volumes:
      - preppilot-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  preppilot-data:
