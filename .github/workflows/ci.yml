name: CI

on:
  push:
    branches: [main, productionization]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check app tests || true
      - name: Unit + API tests (demo mode, no secrets)
        run: uv run pytest -q
        env:
          MODEL_PROVIDER: demo
      - name: Eval smoke gate (router + state machine + heuristics)
        run: uv run python evals_runner.py --smoke
        env:
          MODEL_PROVIDER: demo

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint || true
      - name: Build
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
